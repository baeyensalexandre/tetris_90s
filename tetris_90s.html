<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Tetris Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
            touch-action: none; /* Disable panning and zooming on mobile */
        }
        .game-container {
            box-shadow: 
                0 0 10px rgba(76, 219, 237, 0.5),
                0 0 20px rgba(76, 219, 237, 0.3),
                inset 0 0 15px rgba(0, 0, 0, 0.5);
            border: 3px solid #4c5a6b;
        }
        .info-panel {
            background-color: rgba(13, 17, 23, 0.8);
            border: 2px solid #30363d;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .game-modal {
            background-color: rgba(13, 17, 23, 0.95);
            border: 3px solid #4cdbed;
            box-shadow: 0 0 25px rgba(76, 219, 237, 0.7);
        }
        .control-button {
            transition: all 0.1s ease-in-out;
            border: 2px solid #4c5a6b;
            background-color: #161b22;
        }
        .control-button:active {
            transform: scale(0.95);
            background-color: #30363d;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl md:text-5xl mb-4 text-[#4cdbed] tracking-wider" style="text-shadow: 0 0 10px #4cdbed;">TETRIS</h1>

    <div class="flex flex-col lg:flex-row items-start gap-4">
        <!-- Game Canvas -->
        <div class="relative game-container rounded-lg p-2 bg-black bg-opacity-50">
            <canvas id="tetris" width="300" height="600"></canvas>
            <div id="game-modal" class="absolute inset-0 flex-col items-center justify-center bg-opacity-90 rounded-lg text-center p-8 game-modal hidden z-10">
                <h2 id="modal-title" class="text-4xl mb-4 text-yellow-400">Game Over</h2>
                <p class="text-lg mb-2">Your Score:</p>
                <p id="modal-score" class="text-3xl mb-6 text-white">0</p>
                <button id="play-button" class="px-6 py-3 bg-cyan-500 text-black rounded-md text-xl hover:bg-cyan-400 transition-colors shadow-lg">Play Again</button>
            </div>
        </div>

        <!-- Information Panel -->
        <div class="w-full lg:w-48 flex flex-row lg:flex-col gap-4">
             <div class="info-panel rounded-lg p-4 flex-1 text-center">
                <h2 class="text-lg mb-2 text-cyan-400">SCORE</h2>
                <p id="score" class="text-2xl">0</p>
            </div>
             <div class="info-panel rounded-lg p-4 flex-1 text-center">
                <h2 class="text-lg mb-2 text-cyan-400">NEXT</h2>
                <canvas id="next" width="120" height="120"></canvas>
            </div>
             <div class="info-panel rounded-lg p-4 flex-1 lg:flex-none text-center">
                <h2 class="text-lg mb-2 text-cyan-400">LEVEL</h2>
                <p id="level" class="text-2xl">1</p>
            </div>
             <button id="mute-btn" class="info-panel rounded-lg p-4 w-full mt-4 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" id="volume-icon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.108 12 5v14c0 .892-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Mobile Controls -->
    <div class="lg:hidden mt-6 w-full max-w-xs">
        <div class="flex justify-center mb-2">
             <button id="rotate-btn" class="control-button rounded-full w-20 h-20 flex items-center justify-center text-cyan-400 text-3xl">&#8635;</button>
        </div>
        <div class="flex justify-between items-center">
            <button id="left-btn" class="control-button rounded-full w-20 h-20 flex items-center justify-center text-cyan-400 text-3xl">&#8592;</button>
            <button id="down-btn" class="control-button rounded-full w-20 h-20 flex items-center justify-center text-cyan-400 text-3xl">&#8595;</button>
            <button id="right-btn" class="control-button rounded-full w-20 h-20 flex items-center justify-center text-cyan-400 text-3xl">&#8594;</button>
        </div>
         <div class="flex justify-center mt-2">
             <button id="drop-btn" class="control-button rounded-lg w-full h-16 flex items-center justify-center text-cyan-400 text-xl">DROP</button>
        </div>
    </div>

    <audio id="tetris-theme" loop>
        <source src="https://ia802905.us.archive.org/11/items/TetrisThemeMusic/Tetris.mp3" type="audio/mpeg">
    </audio>


<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');
    const modal = document.getElementById('game-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalScore = document.getElementById('modal-score');
    const playButton = document.getElementById('play-button');
    const muteButton = document.getElementById('mute-btn');
    const volumeIcon = document.getElementById('volume-icon');
    const audio = document.getElementById('tetris-theme');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 30;

    context.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextContext.scale(BLOCK_SIZE, BLOCK_SIZE);

    const COLORS = [
        null,
        '#FF0D72', // T
        '#0DC2FF', // I
        '#0DFF72', // O
        '#F538FF', // L
        '#FF8E0D', // J
        '#FFE138', // S
        '#3877FF', // Z
    ];

    const SHAPES = [
        [], // Empty
        [[1, 1, 1], [0, 1, 0]], // T
        [[2, 2, 2, 2]], // I
        [[3, 3], [3, 3]], // O
        [[4, 0, 0], [4, 4, 4]], // L
        [[0, 0, 5], [5, 5, 5]], // J
        [[0, 6, 6], [6, 6, 0]], // S
        [[7, 7, 0], [0, 7, 7]]  // Z
    ];

    let board = createBoard();
    let player;
    let score = 0;
    let level = 1;
    let linesCleared = 0;
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let paused = true;
    let nextPiece;
    let pieceBag = [];
    let floatingTexts = [];

    function createBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function generatePieceBag() {
        const pieces = 'TIOJLSZ';
        let bag = [];
        for (let i = 0; i < pieces.length; i++) {
            bag.push(createPiece(pieces[i]));
        }
        // Shuffle the bag
        for (let i = bag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [bag[i], bag[j]] = [bag[j], bag[i]];
        }
        return bag;
    }

    function getNextPiece() {
        if (pieceBag.length === 0) {
            pieceBag = generatePieceBag();
        }
        return pieceBag.pop();
    }

    function createPiece(type) {
        switch (type) {
            case 'T': return { shape: SHAPES[1], color: COLORS[1], pos: { x: 3, y: 0 } };
            case 'I': return { shape: SHAPES[2], color: COLORS[2], pos: { x: 3, y: 0 } };
            case 'O': return { shape: SHAPES[3], color: COLORS[3], pos: { x: 4, y: 0 } };
            case 'L': return { shape: SHAPES[4], color: COLORS[4], pos: { x: 3, y: 0 } };
            case 'J': return { shape: SHAPES[5], color: COLORS[5], pos: { x: 3, y: 0 } };
            case 'S': return { shape: SHAPES[6], color: COLORS[6], pos: { x: 3, y: 0 } };
            case 'Z': return { shape: SHAPES[7], color: COLORS[7], pos: { x: 3, y: 0 } };
        }
    }

    function draw() {
        // Draw board
        context.fillStyle = '#0d1117';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(board, { x: 0, y: 0 }, context);
        // Draw player piece
        if (player) {
            drawMatrix(player.shape, player.pos, context);
        }
        // Draw floating score texts
        drawFloatingTexts();
    }

    function drawFloatingTexts() {
        floatingTexts.forEach(textInfo => {
            context.font = "0.8px 'Press Start 2P'";
            context.textAlign = "center";
            context.fillStyle = `rgba(255, 255, 255, ${textInfo.alpha})`;
            context.fillText(textInfo.line1, textInfo.x, textInfo.y);
            context.fillText(textInfo.line2, textInfo.x, textInfo.y + 1);
        });
    }

    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    const color = COLORS[value];
                    ctx.fillStyle = color;
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);

                    // Add a subtle highlight on the top and left
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 0.1); // Top edge
                    ctx.fillRect(x + offset.x, y + offset.y, 0.1, 1); // Left edge

                    // Create a darker shade for the shadow/joint
                    const r = parseInt(color.slice(1, 3), 16);
                    const g = parseInt(color.slice(3, 5), 16);
                    const b = parseInt(color.slice(5, 7), 16);
                    ctx.fillStyle = `rgba(${r * 0.7}, ${g * 0.7}, ${b * 0.7}, 0.5)`;
                    
                    // Draw thin shadow lines on the right and bottom
                    ctx.fillRect(x + offset.x + 0.9, y + offset.y, 0.1, 1); // Right edge
                    ctx.fillRect(x + offset.x, y + offset.y + 0.9, 1, 0.1); // Bottom edge
                }
            });
        });
    }

    function drawNextPiece() {
        nextContext.fillStyle = '#0d1117';
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (nextPiece) {
            const shape = nextPiece.shape;
            const x = (4 - shape[0].length) / 2;
            const y = (4 - shape.length) / 2;
            drawMatrix(shape, {x, y}, nextContext);
        }
    }

    function merge(board, player) {
        player.shape.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    board[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function collide(board, player) {
        const [shape, pos] = [player.shape, player.pos];
        for (let y = 0; y < shape.length; ++y) {
            for (let x = 0; x < shape[y].length; ++x) {
                if (shape[y][x] !== 0 &&
                    (board[y + pos.y] &&
                     board[y + pos.y][x + pos.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function playerDrop() {
        if (paused) return;
        player.pos.y++;
        if (collide(board, player)) {
            player.pos.y--;
            merge(board, player);
            sweepLines();
            playerReset();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        if (paused) return;
        player.pos.x += dir;
        if (collide(board, player)) {
            player.pos.x -= dir;
        }
    }
    
    function hardDrop() {
        if (paused) return;
        while (!collide(board, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        merge(board, player);
        sweepLines();
        playerReset();
        dropCounter = 0;
    }

    function playerRotate(dir) {
        if (paused) return;
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.shape, dir);
        while (collide(board, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.shape[0].length) {
                rotate(player.shape, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }
    
    function rotate(matrix, dir) {
        // Transpose the matrix: rows become columns and vice-versa
        const transposed = matrix[0].map((_, colIndex) => matrix.map(row => row[colIndex]));

        // For clockwise rotation, reverse each new row
        if (dir > 0) {
            transposed.forEach(row => row.reverse());
        } else {
            // For counter-clockwise rotation, reverse the array of rows
            transposed.reverse();
        }
        
        // Clear the original matrix and copy the new rotated one into it
        // to maintain the reference for the player object.
        matrix.length = 0;
        transposed.forEach(row => matrix.push(row));
    }
    
    function sweepLines() {
        let lines = 0;
        let lastClearedRowY;
        outer: for (let y = board.length - 1; y > 0; --y) {
            for (let x = 0; x < board[y].length; ++x) {
                if (board[y][x] === 0) {
                    continue outer;
                }
            }
            const row = board.splice(y, 1)[0].fill(0);
            board.unshift(row);
            lastClearedRowY = y;
            ++y;
            lines++;
        }
        if (lines > 0) {
            const linePoints = [0, 100, 300, 500, 800];
            const scoreGained = linePoints[lines] * level;
            score += scoreGained;
            linesCleared += lines;
            
            let lineText = "";
            switch(lines) {
                case 1: lineText = "SINGLE"; break;
                case 2: lineText = "DOUBLE"; break;
                case 3: lineText = "TRIPLE"; break;
                case 4: lineText = "TETRIS"; break;
            }

            floatingTexts.push({
                line1: lineText,
                line2: `+${scoreGained}`,
                x: COLS / 2,
                y: lastClearedRowY, // Start text where lines were cleared
                alpha: 1.5 // Start with higher alpha to last longer
            });


            if (linesCleared >= level * 10) {
                level++;
                dropInterval *= 0.9;
            }
            updateScore();
        }
    }

    function playerReset() {
        player = nextPiece;
        nextPiece = getNextPiece();
        drawNextPiece();
        player.pos.x = (COLS / 2 | 0) - (player.shape[0].length / 2 | 0);
        player.pos.y = 0;

        if (collide(board, player)) {
            gameOver();
        }
    }

    function update(time = 0) {
        if (paused) {
            requestAnimationFrame(update);
            return;
        }

        // Update floating texts
        floatingTexts.forEach(text => {
            text.y -= 0.05; // Move up
            text.alpha -= 0.02; // Fade out
        });
        floatingTexts = floatingTexts.filter(text => text.alpha > 0);


        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }
        draw();
        requestAnimationFrame(update);
    }

    function updateScore() {
        scoreElement.innerText = score;
        levelElement.innerText = level;
    }

    function startGame() {
        board.forEach(row => row.fill(0));
        score = 0;
        level = 1;
        linesCleared = 0;
        dropInterval = 1000;
        floatingTexts = [];
        pieceBag = generatePieceBag().concat(generatePieceBag()); // Fill with two bags for variety
        nextPiece = getNextPiece();
        playerReset();
        updateScore();
        paused = false;
        modal.classList.add('hidden');
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio autoplay was prevented."));
        update();
    }
    
    function showStartScreen() {
        paused = true;
        modalTitle.innerText = "TETRIS";
        modalScore.parentElement.classList.add('hidden');
        playButton.innerText = "Start Game";
        modal.classList.remove('hidden');
    }

    function gameOver() {
        paused = true;
        audio.pause();
        modalTitle.innerText = "Game Over";
        modalScore.innerText = score;
        modalScore.parentElement.classList.remove('hidden');
        playButton.innerText = "Play Again";
        modal.classList.remove('hidden');
    }

    document.addEventListener('keydown', event => {
        if (paused) return;
        if (event.key === 'ArrowLeft') {
            playerMove(-1);
        } else if (event.key === 'ArrowRight') {
            playerMove(1);
        } else if (event.key === 'ArrowDown') {
            playerDrop();
        } else if (event.key === 'ArrowUp') {
            playerRotate(1);
        } else if (event.key === ' ') {
            event.preventDefault(); // Prevent page scrolling
            hardDrop();
        }
    });
    
    // Mobile Controls
    document.getElementById('left-btn').addEventListener('click', () => playerMove(-1));
    document.getElementById('right-btn').addEventListener('click', () => playerMove(1));
    document.getElementById('down-btn').addEventListener('click', () => playerDrop());
    document.getElementById('rotate-btn').addEventListener('click', () => playerRotate(1));
    document.getElementById('drop-btn').addEventListener('click', () => hardDrop());


    playButton.addEventListener('click', startGame);

    muteButton.addEventListener('click', () => {
        audio.muted = !audio.muted;
        if (audio.muted) {
            volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.108 12 5v14c0 .892-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" /> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l-4-4m0 4l4-4" />`;
        } else {
            volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.108 12 5v14c0 .892-1.077 1.337-1.707.707L5.586 15z" />`;
        }
    });

    showStartScreen();
</script>

</body>
</html>
